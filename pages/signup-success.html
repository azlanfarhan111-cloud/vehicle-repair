<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GearGuard signup confirmation">
  <title>Account Created | GearGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>

<body class="auth-body">
  <div class="site-shell auth-shell">
    <header class="auth-header container">
      <a class="brand" href="index.html" aria-label="GearGuard login">
        <span class="brand-mark">G</span><span>Gear<span>Guard</span></span>
      </a>
    </header>
    <main class="auth-main container">
      <section class="auth-card" aria-labelledby="signup-message">
        <div class="auth-card-heading">
          <p class="eyebrow">Account created</p>
          <h1 id="signup-message">You have successfully signed up. Please login to continue.</h1>
          <p>Your account is ready. Use your email and password to access your workspace.</p>
        </div>
        <a class="button button-primary auth-submit" href="./dashboard.html">Log in to GearGuard →</a>
      </section>
    </main>
    <footer class="auth-footer container">© 2026 GearGuard Workshop · Secure workshop access</footer>
  </div>
  <script src="../app.js"></script>
</body>

</html>
